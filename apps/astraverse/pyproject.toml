[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astraverse"
version = "0.2.0"
description = "AstraVerse local Python FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "websockets>=15,<18",
  "Brotli>=1.1,<2",
  "grpcio>=1.65,<2",
  "protobuf>=5,<8",
  "python-dotenv>=1,<2",
  "mcp>=1.12,<2",
  "qdrant-client>=1.15,<2",
  "pypdf>=5,<7"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["astraverse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
