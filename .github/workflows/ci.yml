name: Validate
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/astraverse-web/package-lock.json
      - run: npm ci
        working-directory: apps/astraverse-web
      - run: npm run build
        working-directory: apps/astraverse-web
      - run: npm run test:scenes && npm run test:watch && npm run test:furniture && npm run test:resources
        working-directory: apps/astraverse-web
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/astraverse/requirements.lock.txt
      - run: pip install -r apps/astraverse/requirements.lock.txt
      - run: pip install --no-deps -e apps/astraverse
      - run: python -m pytest tests -q
        working-directory: apps/astraverse
