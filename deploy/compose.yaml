services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    ports: ["127.0.0.1:8000:8000"]
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports: ["127.0.0.1:5173:5173"]
    environment:
      API_PROXY_TARGET: http://api:8000
    depends_on: [api]
